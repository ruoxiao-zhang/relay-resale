<style>
:root{
  --bg:#EDEFEC; --surface:#F9FAF8; --surface-2:#E3E7E3; --ink:#15191A; --muted:#5A645E; --faint:#8A938D;

    --line:#2A3230; --accent:#72B8AC; --accent-soft:#1C3531; --gold:#CDA66A;

}

  --s-bag:#D39A5E; --s-wj:#7FAEDB; --s-rtw:#C497CB;
}
/* up/down colours follow market convention: green-up in English, red-up in Chinese (A-share) */
.app[data-lang="en"]{--pos:var(--green);--neg:var(--red);--pos-soft:var(--green-soft)}
.app[data-lang="zh"]{--pos:var(--red);--neg:var(--green);--pos-soft:var(--red-soft)}
.app[data-lang="zh"]{--serif:"Noto Serif SC","Songti SC",serif}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
.app{max-width:1200px;margin:0 auto}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:28px 16px;border-bottom:1px solid var(--ink)}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{font-family:var(--serif);font-weight:800;font-size:40px;letter-spacing:.02em;margin:0;line-height:1}
.app[data-lang="zh"] .brand h1{font-weight:900;letter-spacing:.08em}
.brand .sub{font-size:12px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.mast-r{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.mast-r b{color:var(--gold);font-weight:500}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.lang button{background:none;border:0;padding:3px 10px;cursor:pointer;font-size:12px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

.secnav{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.sec{background:none;border:0;border-left:1px solid var(--line);padding:16px 18px 14px;text-align:left;cursor:pointer;display:grid;gap:2px}
.sec:first-child{border-left:0;padding-left:0}
.sec .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec .k i{width:8px;height:8px;border-radius:50%;display:inline-block}
.sec .t{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.25}
.sec .m{font-size:12px;color:var(--muted)}
.sec[aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--sc)}
.sec[aria-pressed="true"] .k{color:var(--ink);font-weight:600}
@media (max-width:640px){.secnav{grid-template-columns:1fr}.sec{border-left:0;border-top:1px solid var(--line);padding-left:0}.sec:first-child{border-top:0}.sec .t{font-size:18px}}

.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,2fr);gap:0 24px;padding-block:18px;border-bottom:1px solid var(--line);align-items:start}
.summary .st{display:grid}
.summary .st span{font-size:12px;color:var(--muted)}
.summary .st b{font-size:22px;font-weight:500;line-height:1.3}
.summary .st small{font-size:12px;color:var(--muted)}
.summary p{margin:0;color:var(--ink);max-width:60ch;font-size:14px}
@media (max-width:860px){.summary{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 16px}.summary p{grid-column:1/-1}}

.main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;margin-top:24px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:1fr}}
h2{font-family:var(--serif);font-weight:600;font-size:19px;margin:0;text-wrap:balance}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools input{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 10px;width:170px;min-width:0}
.empty{padding:24px;text-align:center;color:var(--muted);white-space:normal}
.sec-head select{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 10px}

.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:4px}
table{width:100%;border-collapse:collapse}
th{font-weight:500;font-size:12px;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child{text-align:left}
td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:middle}
td:first-child{text-align:left;white-space:normal}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:var(--surface-2)}
tbody tr[aria-selected="true"]{background:var(--accent-soft)}
tbody tr:last-child td{border-bottom:0}
.it-brand{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.it-name{font-weight:500}
.ret{display:inline-block;min-width:54px;padding:1px 6px;border-radius:3px;font-size:12px;text-align:center}
.ret.hi{background:var(--pos-soft);color:var(--pos)}
.ret.lo{background:var(--surface-2);color:var(--muted)}
.dtype{font-size:11px;color:var(--faint);white-space:nowrap}
@media (max-width:640px){.c-retail,.c-type{display:none}}

.detail{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
@media (max-width:960px){.detail{position:static}}
.d-brand{font-size:12px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.d-name{font-family:var(--serif);font-weight:800;font-size:24px;line-height:1.25;margin:2px 0 6px;text-wrap:balance}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 6px;color:var(--muted)}
.badge.t{border-color:var(--gold);color:var(--gold)}
.d-price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:14px}
.d-price .big{font-size:32px;font-weight:500;line-height:1}
.d-price .lab{font-size:12px;color:var(--muted)}
.range svg{width:100%;height:auto;display:block;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px;border-top:1px solid var(--line)}
.stats div{padding-top:10px;display:grid}
.stats span{font-size:12px;color:var(--muted)}
.stats b{font-weight:500}
.note{font-size:13px;color:var(--muted);margin:12px 0 0;max-width:60ch}
.src{font-size:12px;margin-top:8px;color:var(--muted)}

.est{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.est h3{font-size:14px;margin:0 0 10px;font-weight:600}
.field{display:grid;gap:6px;margin-bottom:12px}
.field>span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:3px;padding:3px 9px;font-size:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline}
.chip small{font-family:var(--mono);color:var(--faint);font-size:11px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:500}
.chip[aria-pressed="true"] small{color:var(--accent)}
.hint{font-size:12px;color:var(--muted)}
.quote{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.quote div{background:var(--bg);border-radius:4px;padding:10px 12px;display:grid}
.quote span{font-size:12px;color:var(--muted)}
.quote b{font-size:17px;font-weight:500}
.quote .fine{grid-column:1/-1;background:none;padding:0;font-size:12px;color:var(--muted)}

.ladder{margin-top:40px}
.ladder .lede{color:var(--muted);font-size:13px;margin:4px 0 14px;max-width:70ch}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.lad{display:grid;gap:6px}
.lrow{display:grid;grid-template-columns:minmax(0,220px) 1fr 56px;gap:12px;align-items:center;cursor:pointer;background:none;border:0;padding:2px 0;text-align:left}
.lrow:hover .ln{text-decoration:underline}
.lmore{background:none;border:1px dashed var(--line);border-radius:4px;padding:6px 10px;font-size:12px;color:var(--muted);cursor:pointer;margin-block:4px}
.lmore:hover{color:var(--ink);border-color:var(--muted)}
.ln{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:12px}
.bar{position:absolute;left:0;top:0;bottom:0;border-radius:0 2px 2px 0}
.par{position:absolute;top:-4px;bottom:-4px;border-left:1px dashed var(--gold)}
.lv{text-align:right;font-size:13px}
.parlab{font-size:11px;color:var(--gold);margin-top:6px}
@media (max-width:560px){.lrow{grid-template-columns:120px 1fr 48px}}

.method{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
@media (max-width:760px){.method{grid-template-columns:1fr}}
.method h2{font-size:16px;margin-bottom:6px}
.method p,.method li{font-size:13px;color:var(--muted);max-width:70ch}
.method ul{padding-left:18px;margin:0}
.method li{margin-bottom:4px}
.badge.warn{border-color:var(--red);color:var(--red)}
.ret.warn{background:none;border:1px dashed var(--faint);color:var(--muted);font-size:11px;white-space:nowrap}
.caveat{font-size:13px;color:var(--ink);background:var(--surface-2);border-radius:4px;padding:8px 10px;margin:12px 0 0;max-width:60ch}
.retfoot{font-size:12px;color:var(--muted);margin-top:8px}
.trend{margin-top:14px}
.trend .th{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.trend svg{width:100%;height:auto;display:block;margin-top:4px}
.trend .wait{font-size:12px;color:var(--faint);border:1px dashed var(--line);border-radius:4px;padding:10px 12px;margin-top:4px}
.loadmsg{padding:40px 0;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app" data-lang="en">

</div>

const COMM={bag:20,wj:15,rtw:40};

const $=s=>document.querySelector(s);
const store={get(k,d){try{return localStorage.getItem('relay-'+k)||d}catch(e){return d}},set(k,v){try{localStorage.setItem('relay-'+k,v)}catch(e){}}};
let S={lang:store.get('lang','en'),sec:store.get('sec','bag'),sel:{},grade:2,kit:0,sort:'ret'};
if(!SECS[S.sec])S.sec='bag';
const L=()=>T[S.lang];
const cur=i=>i.cur==='EUR'?'€':'$';
const money=(v,i)=>cur(i)+Math.round(v).toLocaleString('en-US');
const kfmt=(v,i)=>cur(i)+(v>=10000?(v/1000).toFixed(v>=100000?0:1)+'k':Math.round(v).toLocaleString('en-US'));
const pctS=v=>(v>0?'+':'')+(v*100).toFixed(1)+'%';
const nm=i=>S.lang==='zh'?i.zh:i.name;
const bn=i=>S.lang==='zh'?i.zhb:i.brand;
const median=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const fmtDate=d=>{if(!d)return '—';const t=new Date(d+(d.length===10?'T00:00:00':''));return isNaN(t)?d:t.toLocaleDateString(S.lang==='zh'?'zh-CN':'en-GB',{day:'numeric',month:'short',year:'numeric'})};
const hasRet=i=>i.ret!=null;
const byRetDesc=(a,b)=>(hasRet(b)?b.ret:-1)-(hasRet(a)?a.ret:-1);
const sel=()=>{const list=ITEMS.filter(i=>i.sec===S.sec);return list.find(i=>i.id===S.sel[S.sec])||[...list].sort(byRetDesc)[0]};
// listing aggregates (Purr) overstate retention: asking prices, all sizes pooled
const overstated=i=>i.source==='purr'&&hasRet(i)&&i.ret>=1;
function retCell(i,t,withLabel){
  if(!hasRet(i))return `<span class="ret warn">${i.retail_ambiguous?t.amb:t.unv}</span>`;
  return `<span class="ret num ${i.ret>=1?'hi':'lo'}">${(i.ret*100).toFixed(0)}%${overstated(i)?'*':''}${withLabel?' '+t.vsRetail:''}</span>`;
}

function prep(items){
  items.forEach(i=>{
    if(i.ret==null&&i.mid&&i.retail&&!i.retail_unverified&&!i.retail_ambiguous)i.ret=i.mid/i.retail;
    const h=i.history||[];
    if(i.chg==null&&h.length>1){
      const last=new Date(h[h.length-1].d), ref=[...h].reverse().find(p=>(last-new Date(p.d))/864e5>=28);
      if(ref)i.chg=h[h.length-1].mid/ref.mid-1;
    }
  });
  return items.filter(i=>i.ret!=null||i.mid!=null);
}

function renderChrome(){
  const t=L();
  $('#app').dataset.lang=S.lang;document.documentElement.lang=S.lang==='zh'?'zh-CN':'en';
  $('#brandname').textContent=t.brand;$('#brandsub').textContent=t.sub;$('#asof').innerHTML=t.asof(fmtDate(GENERATED.slice(0,10)));
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===S.lang));
  $('#secnav').innerHTML=Object.entries(SECS).map(([k,s])=>{
    const l=ITEMS.filter(i=>i.sec===k&&hasRet(i));
    return `<button class="sec" data-sec="${k}" aria-pressed="${S.sec===k}" style="--sc:var(${s.c})">
      <span class="k"><i style="background:var(${s.c})"></i>${l.length} ${t.items}</span>
      <span class="t">${s[S.lang]}</span>
      <span class="m">${t.medRet} <span class="num">${(median(l.map(i=>i.ret))*100).toFixed(0)}%</span></span></button>`}).join('');
  const all=ITEMS.filter(i=>i.sec===S.sec), l=all.filter(hasRet), byRet=[...l].sort(byRetDesc), best=byRet[0], worst=byRet[byRet.length-1];
  const spread=l.filter(i=>i.lo!=null&&i.mid).sort((a,b)=>(b.hi-b.lo)/b.mid-(a.hi-a.lo)/a.mid)[0];
  $('#summary').innerHTML=`
    <div class="st"><span>${t.medRet}</span><b class="num">${(median(l.map(i=>i.ret))*100).toFixed(0)}%</b><small>${all.length} ${t.items}${all.length>l.length?` · ${t.excluded(all.length-l.length)}`:''}</small></div>
    <div class="st"><span>${t.best}</span><b class="num pos">${(best.ret*100).toFixed(0)}%</b><small>${bn(best)} ${nm(best)}</small></div>
    ${spread?`<div class="st"><span>${t.range}</span><b class="num">${kfmt(spread.lo,spread)}–${kfmt(spread.hi,spread)}</b><small>${bn(spread)} ${nm(spread)}</small></div>`:'<div></div>'}
    <p>${t.take(l.length,l.filter(i=>i.ret>=1).length,`${bn(best)} ${nm(best)}`,`${bn(worst)} ${nm(worst)}`,S.sec)}</p>`;
  $('#list-title').textContent=SECS[S.sec][S.lang];
  $('#q').placeholder=t.q;
  $('#sort').innerHTML=Object.entries(t.sort).map(([k,v])=>`<option value="${k}" ${k===S.sort?'selected':''}>${v}</option>`).join('');
  $('#thead').innerHTML=`<tr><th>${t.th[0]}</th><th class="c-retail">${t.th[1]}</th><th>${t.th[2]}</th><th>${t.th[3]}</th><th class="c-type">${t.th[4]}</th></tr>`;
}
function renderRows(){
  const t=L(), s=sel();
  const key={ret:byRetDesc,mid:(a,b)=>(b.mid||0)-(a.mid||0),brand:(a,b)=>a.brand.localeCompare(b.brand)}[S.sort];
  const q=$('#q').value.trim().toLowerCase();
  const list=ITEMS.filter(i=>i.sec===S.sec&&(!q||[i.brand,i.zhb,i.name,i.zh].join(' ').toLowerCase().includes(q))).sort(key);
  $('#retfoot').textContent=list.some(overstated)?t.foot:'';
  if(!list.length){$('#rows').innerHTML=`<tr><td colspan="5" class="empty">${t.none}</td></tr>`;return}
  $('#rows').innerHTML=list.map(i=>`
    <tr data-id="${i.id}" aria-selected="${i.id===s.id}" tabindex="0">
      <td><div class="it-brand">${bn(i)}</div><div class="it-name">${nm(i)}</div></td>
      <td class="c-retail num mut">${i.retail?money(i.retail,i):'—'}</td>
      <td class="num">${i.mid?money(i.mid,i):'—'}</td>
      <td>${retCell(i,t,false)}</td>
      <td class="c-type"><span class="dtype">${t.types[i.type]}</span></td>
    </tr>`).join('');
}
function rangeSvg(i){
  const t=L(), W=560,H=92,Lp=14,Rp=14, vals=[i.mid,i.retail,i.lo,i.hi].filter(v=>v!=null);
  let a=Math.min(...vals),b=Math.max(...vals); const pad=(b-a)*0.12||b*0.1; a=Math.max(0,a-pad);b=b+pad;
  const x=v=>Lp+(v-a)/(b-a)*(W-Lp-Rp), y=44, col=i.ret>=1?'var(--pos)':'var(--ink)';
  const band=i.lo!=null?`<rect x="${x(i.lo)}" y="${y-7}" width="${Math.max(2,x(i.hi)-x(i.lo))}" height="14" rx="2" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
    <text x="${x(i.lo)}" y="${y+26}" text-anchor="${x(i.lo)<60?'start':'middle'}" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${kfmt(i.lo,i)}</text>
    <text x="${x(i.hi)}" y="${y+26}" text-anchor="${x(i.hi)>W-60?'end':'middle'}" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${kfmt(i.hi,i)}</text>`
    :`<text x="${W/2}" y="${y+26}" text-anchor="middle" font-size="11" fill="var(--faint)">${t.noRange}</text>`;
  const retailMark=i.retail?(()=>{const rx=x(i.retail), an=rx<70?'start':rx>W-70?'end':'middle';
    return `<line x1="${rx}" x2="${rx}" y1="${y-24}" y2="${y+12}" stroke="var(--gold)" stroke-dasharray="3 3"/>
    <text x="${rx}" y="${y-28}" text-anchor="${an}" font-size="11" fill="var(--gold)">${t.retail} ${kfmt(i.retail,i)}</text>`})():'';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t.lo}–${t.hi}">
    <line x1="${Lp}" x2="${W-Rp}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>
    ${band}${retailMark}
    <circle cx="${x(i.mid)}" cy="${y}" r="6" fill="${col}" stroke="var(--surface)" stroke-width="2"/>
  </svg>`;
}
function trendSvg(i){
  const t=L(), h=i.history||[];
  if(!i.auto)return `<div class="trend"><div class="wait">${t.manualTrend}</div></div>`;
  if(h.length<2)return `<div class="trend"><div class="th"><span>${t.trend}</span></div><div class="wait">${t.wait(h.length)}</div></div>`;
  const W=560,H=150,Lp=52,Rp=10,Tp=10,Bp=24, v=h.map(p=>p.mid);
  let a=Math.min(...v),b=Math.max(...v); const pad=(b-a)*0.15||b*0.03; a-=pad;b+=pad;
  const x=k=>Lp+k*(W-Lp-Rp)/(h.length-1), y=val=>Tp+(1-(val-a)/(b-a))*(H-Tp-Bp);
  const d=h.map((p,k)=>(k?'L':'M')+x(k).toFixed(1)+' '+y(p.mid).toFixed(1)).join(' ');
  const up=v[v.length-1]>=v[0], col=up?'var(--pos)':'var(--neg)';
  const ticks=[a+pad,(a+b)/2,b-pad].map(val=>`<line x1="${Lp}" x2="${W-Rp}" y1="${y(val)}" y2="${y(val)}" stroke="var(--line)"/><text x="${Lp-6}" y="${y(val)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${kfmt(val,i)}</text>`).join('');
  const lab=(k,an)=>`<text x="${x(k)}" y="${H-6}" text-anchor="${an}" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${h[k].d.slice(5)}</text>`;
  return `<div class="trend"><div class="th"><span>${t.trend}</span><span class="num ${up?'pos':'neg'}">${pctS(v[v.length-1]/v[0]-1)}</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t.trend}">${ticks}
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x(h.length-1)}" cy="${y(v[v.length-1])}" r="4" fill="${col}" stroke="var(--surface)" stroke-width="2"/>
    ${lab(0,'start')}${lab(h.length-1,'end')}</svg></div>`;
}
function renderDetail(){
  const t=L(), i=sel(), hasP=i.mid!=null;
  let quote='';
  if(hasP){
    const kits=t.kits[i.sec], gm=GM[S.grade], km=kits[Math.min(S.kit,kits.length-1)][1], v=i.mid*gm*km, c=COMM[i.sec];
    quote=`<div class="field"><span>${t.cond}</span><div class="chips">${t.grades.map((g,k)=>`<button class="chip" data-grade="${k}" aria-pressed="${k===S.grade}">${g[0]}<small>×${GM[k].toFixed(2)}</small></button>`).join('')}</div>
      <div class="hint">${t.grades[S.grade][0]} · ${t.grades[S.grade][1]}</div></div>
    <div class="field"><span>${t.kit}</span><div class="chips">${kits.map((k,n)=>`<button class="chip" data-kit="${n}" aria-pressed="${n===Math.min(S.kit,kits.length-1)}">${k[0]}<small>×${k[1].toFixed(2)}</small></button>`).join('')}</div></div>
    <div class="quote"><div><span>${t.resale}</span><b class="num">${kfmt(v*.95,i)} – ${kfmt(v*1.05,i)}</b></div>
      <div><span>${t.payout}</span><b class="num">${money(v*(1-c/100),i)}</b></div>
      <div class="fine">${t.fine(c)}</div></div>`;
  } else quote=`<p class="hint">${t.noPrice}</p>`;
  $('#detail').innerHTML=`
    <div class="d-brand">${bn(i)}</div>
    <div class="d-name">${nm(i)}</div>
    <div class="badges"><span class="badge t">${t.types[i.type]}</span>${i.source==='purr'?`<span class="badge">${t.pooled}</span>`:''}<span class="badge">${i.auto?t.auto:t.manual}</span><span class="badge num">${fmtDate(i.asof)}</span>
      ${i.cur==='EUR'?'<span class="badge">EUR</span>':''}${i.stale?`<span class="badge warn">${t.stale}</span>`:''}</div>
    <div class="d-price">${hasP?`<span class="big num">${money(i.mid,i)}</span><span class="lab">${t.typical}</span>`:''}
      ${retCell(i,t,true)}</div>
    ${hasP?`<div class="range">${rangeSvg(i)}</div>`:''}
    <div class="stats">
      <div><span>${t.retail}</span><b class="num">${i.retail?money(i.retail,i):'—'}</b></div>
      <div><span>${t.n}</span><b class="num">${i.n??'—'}</b></div>
      <div><span>${t.chg}</span><b class="num ${i.chg==null?'mut':i.chg>0?'pos':'neg'}">${i.chg==null?'—':pctS(i.chg)}</b></div>
    </div>
    ${trendSvg(i)}
    ${!hasRet(i)&&i.retail_unverified?`<p class="caveat">${t.unvNote}</p>`:''}
    ${overstated(i)?`<p class="caveat">${t.highNote}</p>`:''}
    <p class="note">${i.note[S.lang]}</p>
    ${i.retail_note?`<p class="note">${i.retail_note[S.lang]}</p>`:''}
    <div class="src">${t.source}: <a href="${i.src[1]}" target="_blank" rel="noopener">${i.src[0]}</a>
      ${i.retail_src?`<br>${t.retailSrc}: <a href="${i.retail_src[1]}" target="_blank" rel="noopener">${i.retail_src[0]}</a>${i.retail_checked?` · ${fmtDate(i.retail_checked)}`:''}`:''}</div>
    <div class="est"><h3>${t.est}</h3>${quote}</div>`;
}
function renderLadder(){
  const t=L(), list=ITEMS.filter(hasRet).sort(byRetDesc), max=Math.max(...list.map(i=>i.ret))*1.04, par=100/max;
  $('#lad-title').textContent=t.ladT;$('#lad-lede').textContent=t.ladL;$('#parlab').textContent=t.par;
  $('#legend').innerHTML=Object.values(SECS).map(s=>`<span><i style="background:var(${s.c})"></i>${s[S.lang]}</span>`).join('');
  const TOP=12,BOT=8, cut=!S.ladAll&&list.length>TOP+BOT+4;
  const shown=cut?[...list.slice(0,TOP),null,...list.slice(-BOT)]:list;
  $('#lad').innerHTML=shown.map(i=>i===null?`<button class="lmore" data-ladall="1">${t.more(list.length-TOP-BOT)}</button>`:`<button class="lrow" data-jump="${i.id}">
    <span class="ln">${bn(i)} ${nm(i)}</span>
    <span class="track"><span class="bar" style="width:${(i.ret/max*100).toFixed(1)}%;background:var(${SECS[i.sec].c});opacity:${i.sec===S.sec?1:.45}"></span><span class="par" style="left:${par.toFixed(1)}%"></span></span>
    <span class="lv num ${i.ret>=1?'pos':'mut'}">${(i.ret*100).toFixed(0)}%</span></button>`).join('')
    +(S.ladAll&&list.length>TOP+BOT+4?`<button class="lmore" data-ladall="0">${t.less}</button>`:'');
  const seen=new Set(), srcs=ITEMS.filter(i=>!seen.has(i.src[0])&&seen.add(i.src[0]));
  $('#method').innerHTML=`<div><h2>${t.mT}</h2><p>${t.m1}</p><p>${t.m2}</p></div>
    <div><h2>${t.sT}</h2><ul>${srcs.map(i=>`<li><a href="${i.src[1]}" target="_blank" rel="noopener">${i.src[0]}</a></li>`).join('')}
    <li><a href="https://mygemma.com/blogs/news/luxury-resale-index-2026" target="_blank" rel="noopener">myGemma Luxury Resale Index 2026</a></li>
    <li><a href="https://www.rebag.com/clair-report/" target="_blank" rel="noopener">Rebag Clair Report</a></li></ul></div>`;
}
function renderAll(){renderChrome();renderRows();renderDetail();renderLadder()}

document.addEventListener('click',e=>{
  const b=e.target.closest('button[data-lang],[data-sec],[data-id],[data-grade],[data-kit],[data-jump],[data-ladall]');if(!b||!ITEMS.length)return;
  const d=b.dataset;
  if(d.ladall){S.ladAll=d.ladall==='1';renderLadder()}
  else if(d.lang){S.lang=d.lang;store.set('lang',S.lang);renderAll()}
  else if(d.sec){S.sec=d.sec;store.set('sec',S.sec);S.kit=0;$('#q').value='';renderAll()}
  else if(d.id){S.sel[S.sec]=d.id;S.grade=2;S.kit=0;renderRows();renderDetail();
    if(window.innerWidth<=960)$('#detail').scrollIntoView({behavior:'smooth',block:'start'})}
  else if(d.grade){S.grade=+d.grade;renderDetail()}
  else if(d.kit){S.kit=+d.kit;renderDetail()}
  else if(d.jump){const i=ITEMS.find(x=>x.id===d.jump);S.sec=i.sec;S.sel[i.sec]=i.id;store.set('sec',S.sec);S.grade=2;S.kit=0;renderAll();
    $('.main').scrollIntoView({behavior:'smooth',block:'start'})}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('tr[data-id]'))e.target.click()});
$('#sort').addEventListener('change',e=>{S.sort=e.target.value;renderRows()});
$('#q').addEventListener('input',()=>{if(ITEMS.length)renderRows()});

fetch('data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{
  GENERATED=d.generated||'';ITEMS=prep(d.items||[]);renderAll();
}).catch(()=>{$('.main').innerHTML=`<p class="loadmsg">${L().fail}</p>`});
</script>
